name: Sentinel Security Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  security-events: write
jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true
      - name: Sentinel policy gate
        env:
          PYTHONPATH: src
        run: |
          python -m sentinel scan --input sample_data/findings.json --output reports || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-security-reports
          path: reports/
