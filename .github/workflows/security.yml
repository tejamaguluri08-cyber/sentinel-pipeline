name: Sentinel Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sentinel Pipeline
        env:
          PYTHONPATH: src
        run: |
          python -m sentinel scan \
            --input sample_data/findings.json \
            --output reports

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-security-reports
          path: reports/
